services:
  backend:
    image: ${DOCKER_USER}/vlxd-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${PROTOCOL:-https}://${DOMAIN}
      ADMIN_URL: ${PROTOCOL:-https}://${DOMAIN}/admin
      FRONTEND_CONFIG_DIR: /data/config/pages
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    volumes:
      - shared-config:/data/config/pages
    expose:
      - "5000"

  frontend:
    image: ${DOCKER_USER}/vlxd-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - shared-config:/app/config/pages
    expose:
      - "3000"

  admin:
    image: ${DOCKER_USER}/vlxd-admin:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - frontend
      - admin
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  shared-config:
  certbot-etc:
  certbot-var:
  certbot-webroot:
